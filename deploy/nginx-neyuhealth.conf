# /etc/nginx/sites-available/neyuhealth.com  →  ln -s to sites-enabled. Test with `nginx -t`, then `systemctl reload nginx`.
# The certificate must exist first (one certificate for neyuhealth.com + www.neyuhealth.com):
#   sudo certbot certificates      → lists it. If missing:
#   sudo certbot certonly --nginx -d neyuhealth.com -d www.neyuhealth.com --deploy-hook "systemctl reload nginx"
# Renewal is automatic (certbot timer).

# App servers. One server is enough for 5,000 visitors a day; for a second one, start the
# app on another port or machine (RUN_WORKER=0 there — see deploy/README.md) and uncomment.
upstream neyu_app {
  least_conn;
  server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
  # server 127.0.0.1:3001 max_fails=3 fail_timeout=15s;
  keepalive 32;                       # reuse connections to Node (less work per request)
}

# Access log with how long each request took (request_time) and the app's share (upstream_response_time).
log_format combined_timed '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Extra guard for sign-in and sign-up (the app has its own limits too).
limit_req_zone $binary_remote_addr zone=neyu_auth:10m rate=20r/m;

server {
  listen 80;
  server_name neyuhealth.com www.neyuhealth.com;
  return 301 https://neyuhealth.com$request_uri;
}
# TLS session cache for both names below (protocols: Ubuntu default TLS 1.2 + 1.3)
ssl_session_cache shared:NEYU_SSL:10m;
ssl_session_timeout 1d;

server {
  listen 443 ssl http2;
  server_name www.neyuhealth.com;
  ssl_certificate     /etc/letsencrypt/live/neyuhealth.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/neyuhealth.com/privkey.pem;
  return 301 https://neyuhealth.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name neyuhealth.com;
  ssl_certificate     /etc/letsencrypt/live/neyuhealth.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/neyuhealth.com/privkey.pem;

  client_max_body_size 16m;          # report uploads (15 MB limit in the app)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json application/xml application/manifest+json image/svg+xml text/plain text/xml;

  # Request time in the access log, so slow pages show up (see deploy/MONITORING.md).
  access_log /var/log/nginx/neyu.access.log combined_timed;

  # Same headers to the app for every request. X-Forwarded-For is SET (not appended), so a
  # visitor can't fake their address to get around the sign-in limits.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";
  proxy_read_timeout 120s;           # report reading / PDF can take up to ~60 s
  proxy_next_upstream error timeout http_502 http_503;

  # Built files have a version in their name: cache for a year.
  location /_next/static/ { proxy_pass http://neyu_app; expires 1y; add_header Cache-Control "public, immutable"; access_log off; }

  # Pictures, videos and fonts from /public: a week.
  location ~* \.(?:mp4|webm|png|jpe?g|webp|svg|ico|woff2?)$ { proxy_pass http://neyu_app; expires 7d; add_header Cache-Control "public, stale-while-revalidate=86400"; access_log off; }

  # Neyu chat streams its answer word by word: no buffering here.
  location /api/chat { proxy_pass http://neyu_app; proxy_buffering off; }

  location ~ ^/api/(portal/auth/|admin/login|admin/mfa) { limit_req zone=neyu_auth burst=20 nodelay; limit_req_status 429; proxy_pass http://neyu_app; }

  # Health check for uptime monitors / a load balancer (no sign-in, no logging).
  location = /api/v1/health { proxy_pass http://neyu_app; access_log off; }

  location / { proxy_pass http://neyu_app; }
}
