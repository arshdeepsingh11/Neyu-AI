# /etc/nginx/sites-available/neyuhealth.com  →  ln -s to sites-enabled, then: certbot --nginx -d neyuhealth.com -d www.neyuhealth.com
server {
  listen 80;
  server_name neyuhealth.com www.neyuhealth.com;
  return 301 https://neyuhealth.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name www.neyuhealth.com;
  # ssl_certificate lines are added by certbot
  return 301 https://neyuhealth.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name neyuhealth.com;
  # ssl_certificate lines are added by certbot

  client_max_body_size 16m;          # report uploads (15 MB limit in the app)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on; gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location /_next/static/ { proxy_pass http://127.0.0.1:3000; expires 1y; add_header Cache-Control "public, immutable"; }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;              # Neyu chat streams answers
    proxy_read_timeout 120s;          # report reading / PDF can take up to ~60 s
  }
}
