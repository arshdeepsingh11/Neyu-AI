# PostgreSQL 16 settings for NEYU (Phase 5) — sized for the planned server:
# 2 vCPU, 4 GB RAM, SSD, up to 5,000 visitors a day. For 8 GB RAM double the four memory lines.
#
#   sudo cp deploy/postgresql-neyu.conf /etc/postgresql/16/main/conf.d/neyu.conf
#   sudo systemctl restart postgresql
#   sudo -u postgres psql -d neyu -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"

# Memory
shared_buffers = 1GB                  # ~25% of RAM
effective_cache_size = 3GB            # ~75% of RAM (a hint for the planner, not allocated)
work_mem = 16MB                       # per sort/hash; dashboards sort large groups
maintenance_work_mem = 256MB          # faster VACUUM and index builds

# SSD disk
random_page_cost = 1.1
effective_io_concurrency = 200

# Connections: app copies × connection_limit (DATABASE_URL) + worker + admin tools.
max_connections = 100
idle_in_transaction_session_timeout = 60s   # a stuck request can't hold locks forever

# Write-ahead log
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB

# Autovacuum: page views and audit rows arrive all day — clean up and re-plan sooner.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Find slow queries (see deploy/MONITORING.md)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 500ms    # every query slower than half a second goes to the log
log_lock_waits = on
log_autovacuum_min_duration = 10s
