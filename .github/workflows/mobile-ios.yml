# NEYU iPhone app — built in the cloud on a Mac by GitHub (no Mac needed).
# Runs when mobile/ changes on the "test" branch, or by hand: GitHub → Actions → "Mobile · iPhone" → Run workflow.
#
# Job 1 (always): builds the app for the iPhone Simulator — proves the project compiles. No Apple account needed.
# Job 2 (only with the secrets below): signs the app and uploads it to TestFlight.
#   APPLE_TEAM_ID              10-character Team ID (developer.apple.com → Membership)
#   APP_STORE_CONNECT_KEY_ID   ┐ App Store Connect → Users and Access → Integrations → Team Keys
#   APP_STORE_CONNECT_ISSUER_ID│ (role: App Manager). The .p8 file's contents go in
#   APP_STORE_CONNECT_KEY      ┘ APP_STORE_CONNECT_KEY (base64 or the text itself)
# The app record (bundle id com.neyuhealth.app) must exist in App Store Connect first (README step E).
name: "Mobile · iPhone"

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server the app opens: live, or a full https address (e.g. https://staging.neyuhealth.com)"
        default: live
      testflight:
        description: "Upload to TestFlight (needs the Apple secrets)"
        type: boolean
        default: false
  push:
    branches: [test]
    paths: ["mobile/**", ".github/workflows/mobile-ios.yml"]

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Choose the server
        env:
          SERVER: ${{ github.event.inputs.server || 'live' }}
        run: |
          if [ "$SERVER" = "live" ]; then npm run target -- live; else npm run target -- staging "$SERVER"; fi
      - name: Sync the native project
        run: |
          npx cap sync ios
          node scripts/native-setup.mjs
          node scripts/check.mjs
      - name: Build for the iPhone Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test "${PIPESTATUS[0]}" = "0"

  testflight:
    needs: simulator
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.testflight == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - name: Apple secrets present?
        working-directory: .
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER" ] || [ -z "$ASC_KEY" ]; then
            echo "::error::Add APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_KEY (mobile/README.md step E)."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install and sync
        env:
          SERVER: ${{ github.event.inputs.server || 'live' }}
        run: |
          npm ci
          if [ "$SERVER" = "live" ]; then npm run target -- live; else npm run target -- staging "$SERVER"; fi
          npx cap sync ios
          node scripts/native-setup.mjs
      - name: App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if printf '%s' "$ASC_KEY" | grep -q "BEGIN PRIVATE KEY"; then printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/keys/AuthKey.p8"; else printf '%s' "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"; fi
      - name: Archive (signed by Apple automatically)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/NEYU.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -n 40
          test "${PIPESTATUS[0]}" = "0"
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NEYU.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER"
          echo "Uploaded. It appears in App Store Connect → TestFlight after Apple's processing (10–30 min)."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
