# NEYU Android app — built in the cloud by GitHub (no Android Studio needed).
# Runs when mobile/ changes on the "test" branch, or by hand: GitHub → Actions → "Mobile · Android" → Run workflow.
# Result: Actions run → Artifacts → neyu-android (APK to install on phones; AAB for Google Play when signed).
#
# Optional secrets (GitHub → Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON     contents of google-services.json from Firebase → turns on push notifications
#   ANDROID_KEYSTORE_BASE64  upload key (.jks) as base64      ┐ all four → a signed release
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD ┘ bundle (.aab) for Google Play
name: "Mobile · Android"

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server the app opens: live, or a full https address (e.g. https://staging.neyuhealth.com)"
        default: live
  push:
    branches: [test]
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Choose the server
        env:
          SERVER: ${{ github.event.inputs.server || 'live' }}
        run: |
          if [ "$SERVER" = "live" ]; then npm run target -- live; else npm run target -- staging "$SERVER"; fi

      - name: Firebase file (push notifications)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > firebase/google-services.json

      - name: Sync the native project
        run: |
          npx cap sync android
          node scripts/native-setup.mjs
          node scripts/check.mjs

      - name: Version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build test APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release bundle (Google Play)
        if: env.KEYSTORE_B64 != ''
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon --stacktrace
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: neyu-android
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
