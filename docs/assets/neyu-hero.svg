<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="NEYU Health — your health, connected">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A20"/><stop offset=".55" stop-color="#0E2F38"/><stop offset="1" stop-color="#173F4A"/>
    </linearGradient>
    <radialGradient id="orb" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".22" stop-color="#C9F3F1"/><stop offset=".55" stop-color="#4FC3C0"/><stop offset="1" stop-color="#1B6F7A"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5FD3CF" stop-opacity=".55"/><stop offset="1" stop-color="#5FD3CF" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3FA7B4" stop-opacity=".35"/><stop offset="1" stop-color="#3FA7B4" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8E7CF0" stop-opacity=".22"/><stop offset="1" stop-color="#8E7CF0" stop-opacity="0"/></radialGradient>
    <linearGradient id="ecg" x1="0" x2="1"><stop offset="0" stop-color="#5FD3CF" stop-opacity="0"/><stop offset=".25" stop-color="#5FD3CF"/><stop offset=".75" stop-color="#9BE7E3"/><stop offset="1" stop-color="#5FD3CF" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .float{animation:float 9s ease-in-out infinite}
      .float2{animation:float 12s ease-in-out infinite reverse}
      @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-18px)}}
      .ring{transform-origin:930px 190px;animation:ring 4s ease-out infinite}
      .ring.b{animation-delay:1.33s}.ring.c{animation-delay:2.66s}
      @keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.9);opacity:0}}
      .breathe{transform-origin:930px 190px;animation:breathe 4s ease-in-out infinite}
      @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
      .ecg{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 5s linear infinite}
      @keyframes draw{0%{stroke-dashoffset:1400}70%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
      .live{animation:blink 1.6s ease-in-out infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      .rise{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <ellipse class="float" cx="260" cy="90" rx="360" ry="180" fill="url(#aur1)"/>
  <ellipse class="float2" cx="980" cy="340" rx="380" ry="170" fill="url(#aur2)"/>

  <!-- Neyu orb -->
  <circle cx="930" cy="190" r="150" fill="url(#glow)"/>
  <circle class="ring" cx="930" cy="190" r="86" fill="none" stroke="#7FE0DC" stroke-opacity=".55" stroke-width="1.5"/>
  <circle class="ring b" cx="930" cy="190" r="86" fill="none" stroke="#7FE0DC" stroke-opacity=".55" stroke-width="1.5"/>
  <circle class="ring c" cx="930" cy="190" r="86" fill="none" stroke="#7FE0DC" stroke-opacity=".55" stroke-width="1.5"/>
  <g class="breathe"><circle cx="930" cy="190" r="78" fill="url(#orb)"/><ellipse cx="905" cy="160" rx="26" ry="16" fill="#FFFFFF" fill-opacity=".55"/></g>
  <text class="t" x="930" y="312" text-anchor="middle" font-size="15" letter-spacing="4" fill="#9BE7E3" font-weight="600">NEYU · AI</text>

  <!-- Copy -->
  <g class="t">
    <g class="rise d1"><text x="72" y="104" font-size="15" letter-spacing="5" fill="#9BE7E3" font-weight="700">NEYU HEALTH</text></g>
    <g class="rise d2"><text x="70" y="172" font-size="56" fill="#FFFFFF" font-weight="600" letter-spacing="-1.5">Your health,</text>
    <text x="70" y="234" font-size="56" fill="#FFFFFF" font-weight="600" letter-spacing="-1.5">connected.</text></g>
    <g class="rise d3"><text x="72" y="276" font-size="19" fill="#C4D6DA">AI-enabled care platform · cardiology, prevention &amp; longevity</text>
    <text x="72" y="302" font-size="19" fill="#C4D6DA">Built in Calgary, Alberta · health data stays in Canada</text></g>
    <g class="rise d4">
      <rect x="70" y="326" width="236" height="38" rx="19" fill="#FFFFFF" fill-opacity=".08" stroke="#9BE7E3" stroke-opacity=".35"/>
      <circle class="live" cx="92" cy="345" r="5.5" fill="#4ADE80"/>
      <text x="106" y="350" font-size="15" fill="#E7F6F6" font-weight="600">Live · neyuhealth.com</text>
    </g>
  </g>

  <!-- heartbeat -->
  <path class="ecg" d="M0 392 H360 l18 0 l10 -26 l12 52 l14 -78 l14 92 l10 -40 h40 H760 l16 0 l8 -18 l10 36 l12 -54 l12 62 l8 -26 h30 H1200" fill="none" stroke="url(#ecg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
