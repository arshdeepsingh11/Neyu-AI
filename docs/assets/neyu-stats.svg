<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="NEYU Health platform at a glance">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A20"/><stop offset="1" stop-color="#0F2C35"/></linearGradient>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.tile{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}
.seg{opacity:0;animation:segin .5s ease forwards}@keyframes segin{to{opacity:1}}</style></defs>
<rect width="1200" height="330" rx="28" fill="url(#bg)"/>
<text class="t" x="40" y="46" font-size="20" font-weight="700" fill="#FFFFFF">Platform at a glance</text>
<text class="t" x="250" y="46" font-size="13.5" fill="#9BB8BE">counted from the codebase · October 2026</text>
<text class="t" x="40" y="250" font-size="12" letter-spacing="3" font-weight="700" fill="#6FB9C0">BUILD PROGRESS — PHASES 0 TO 3 COMPLETE</text>
<g class="tile" style="animation-delay:0.00s">
<rect x="40" y="70" width="173" height="150" rx="18" fill="#10313A" stroke="#5FD3CF" stroke-opacity=".28"/>
<text class="t" x="58" y="128" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-1">52</text>
<text class="t" x="58" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">pages</text>
<text class="t" x="58" y="178" font-size="12" fill="#8FAAB0">patient, clinic &amp; public</text>
<rect x="58" y="196" width="137" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="58" y="196" width="137" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:0.40s;transform-origin:58px 198px"/>
</g>
<g class="tile" style="animation-delay:0.12s">
<rect x="229" y="70" width="173" height="150" rx="18" fill="#10313A" stroke="#5FD3CF" stroke-opacity=".28"/>
<text class="t" x="247" y="128" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-1">101</text>
<text class="t" x="247" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">API endpoints</text>
<text class="t" x="247" y="178" font-size="12" fill="#8FAAB0">incl. versioned /api/v1</text>
<rect x="247" y="196" width="137" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="247" y="196" width="137" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:0.52s;transform-origin:247px 198px"/>
</g>
<g class="tile" style="animation-delay:0.24s">
<rect x="419" y="70" width="173" height="150" rx="18" fill="#10313A" stroke="#5FD3CF" stroke-opacity=".28"/>
<text class="t" x="437" y="128" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-1">59</text>
<text class="t" x="437" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">database tables</text>
<text class="t" x="437" y="178" font-size="12" fill="#8FAAB0">PostgreSQL 16</text>
<rect x="437" y="196" width="137" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="437" y="196" width="137" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:0.64s;transform-origin:437px 198px"/>
</g>
<g class="tile" style="animation-delay:0.36s">
<rect x="608" y="70" width="173" height="150" rx="18" fill="#10313A" stroke="#5FD3CF" stroke-opacity=".28"/>
<text class="t" x="626" y="128" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-1">136</text>
<text class="t" x="626" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">UI components</text>
<text class="t" x="626" y="178" font-size="12" fill="#8FAAB0">React · TypeScript</text>
<rect x="626" y="196" width="137" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="626" y="196" width="137" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:0.76s;transform-origin:626px 198px"/>
</g>
<g class="tile" style="animation-delay:0.48s">
<rect x="797" y="70" width="173" height="150" rx="18" fill="#10313A" stroke="#5FD3CF" stroke-opacity=".28"/>
<text class="t" x="815" y="128" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-1">6 · 19</text>
<text class="t" x="815" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">roles · permissions</text>
<text class="t" x="815" y="178" font-size="12" fill="#8FAAB0">break-glass with reasons</text>
<rect x="815" y="196" width="137" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="815" y="196" width="137" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:0.88s;transform-origin:815px 198px"/>
</g>
<g class="tile" style="animation-delay:0.60s">
<rect x="987" y="70" width="173" height="150" rx="18" fill="#10313A" stroke="#5FD3CF" stroke-opacity=".28"/>
<text class="t" x="1005" y="128" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-1">293</text>
<text class="t" x="1005" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">automated checks</text>
<text class="t" x="1005" y="178" font-size="12" fill="#8FAAB0">all passing</text>
<rect x="1005" y="196" width="137" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="1005" y="196" width="137" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:1.00s;transform-origin:1005px 198px"/>
</g>
<rect class="seg" x="42" y="262" width="108" height="10" rx="5" fill="#5FD3CF" style="animation-delay:1.00s"/>
<text class="t" x="96" y="294" text-anchor="middle" font-size="11.5" fill="#DDF4F3">0 · Ship</text>
<rect class="seg" x="154" y="262" width="108" height="10" rx="5" fill="#5FD3CF" style="animation-delay:1.08s"/>
<text class="t" x="208" y="294" text-anchor="middle" font-size="11.5" fill="#DDF4F3">1 · Design</text>
<rect class="seg" x="266" y="262" width="108" height="10" rx="5" fill="#5FD3CF" style="animation-delay:1.16s"/>
<text class="t" x="320" y="294" text-anchor="middle" font-size="11.5" fill="#DDF4F3">2 · Database</text>
<rect class="seg" x="378" y="262" width="108" height="10" rx="5" fill="#5FD3CF" style="animation-delay:1.24s"/>
<text class="t" x="432" y="294" text-anchor="middle" font-size="11.5" fill="#DDF4F3">3 · Core backend</text>
<rect class="seg" x="490" y="262" width="108" height="10" rx="5" fill="#FFC86B" style="animation-delay:1.32s"/>
<text class="t" x="544" y="294" text-anchor="middle" font-size="11.5" fill="#DDF4F3">4 · Legal</text>
<rect class="seg" x="602" y="262" width="108" height="10" rx="5" fill="#2A4A52" style="animation-delay:1.40s"/>
<text class="t" x="656" y="294" text-anchor="middle" font-size="11.5" fill="#7D979D">5 · Dashboards</text>
<rect class="seg" x="714" y="262" width="108" height="10" rx="5" fill="#2A4A52" style="animation-delay:1.48s"/>
<text class="t" x="768" y="294" text-anchor="middle" font-size="11.5" fill="#7D979D">6 · Scale</text>
<rect class="seg" x="826" y="262" width="108" height="10" rx="5" fill="#2A4A52" style="animation-delay:1.56s"/>
<text class="t" x="880" y="294" text-anchor="middle" font-size="11.5" fill="#7D979D">7 · Mobile app</text>
<rect class="seg" x="938" y="262" width="108" height="10" rx="5" fill="#2A4A52" style="animation-delay:1.64s"/>
<text class="t" x="992" y="294" text-anchor="middle" font-size="11.5" fill="#7D979D">8 · Devices</text>
<rect class="seg" x="1050" y="262" width="108" height="10" rx="5" fill="#2A4A52" style="animation-delay:1.72s"/>
<text class="t" x="1104" y="294" text-anchor="middle" font-size="11.5" fill="#7D979D">9 · Go live</text>
</svg>