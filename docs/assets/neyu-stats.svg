<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="NEYU Health platform at a glance">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A20"/><stop offset="1" stop-color="#0F2C35"/></linearGradient>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.tile{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}</style></defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<text class="t" x="50" y="46" font-size="20" font-weight="700" fill="#FFFFFF">Platform at a glance</text>
<text class="t" x="250" y="46" font-size="13.5" fill="#9BB8BE">counted from the codebase and test runs · October 2026</text>
<g class="tile" style="animation-delay:0.00s">
<rect x="50" y="70" width="170" height="150" rx="18" fill="#10313A" stroke="#5FD3CF" stroke-opacity=".28"/>
<text class="t" x="68" y="128" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-1">58</text>
<text class="t" x="68" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">pages</text>
<text class="t" x="68" y="178" font-size="12" fill="#8FAAB0">public · patient · clinic</text>
<rect x="68" y="196" width="134" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="68" y="196" width="134" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:0.40s;transform-origin:68px 198px"/>
</g>
