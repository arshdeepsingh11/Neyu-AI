<text class="t" x="254" y="156" font-size="14.5" font-weight="600" fill="#BFE9E7">API endpoints</text>
<text class="t" x="254" y="178" font-size="12" fill="#8FAAB0">incl. versioned /api/v1</text>
<rect x="254" y="196" width="134" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
<rect class="bar" x="254" y="196" width="134" height="5" rx="2.5" fill="#5FD3CF" style="animation-delay:0.48s;transform-origin:254px 198px"/>
</g>
