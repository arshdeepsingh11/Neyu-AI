# NEYU Health — local services (Phase 2).
# Start:  docker compose up -d        Stop:  docker compose down
# Data is kept in Docker volumes between restarts. Wipe everything: docker compose down -v
#
#   PostgreSQL  localhost:5433   user neyu / password neyu_local / database neyu
#   Redis       localhost:6379   (cache + job queues, used from Phase 3)
#   MinIO       (off for now)    S3 file storage — the minio/minio image was removed from Docker Hub;
#                                a replacement is chosen in Phase 3. Start it later with: docker compose --profile files up -d
#   Mailpit     localhost:1025   catches every email · inbox http://localhost:8025
#
# These passwords are for your PC only. Production uses its own secrets.

name: neyu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neyu
      POSTGRES_PASSWORD: neyu_local
      POSTGRES_DB: neyu
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Same settings we will use in production: query statistics + log slow queries (> 200 ms).
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=200
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neyu -d neyu"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    profiles: ["files"] # off by default until Phase 3
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neyu
      MINIO_ROOT_PASSWORD: neyu_local_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private "neyu-files" bucket once MinIO is up, then exits.
  minio-init:
    profiles: ["files"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 neyu neyu_local_minio &&
      mc mb --ignore-existing local/neyu-files &&
      mc anonymous set none local/neyu-files &&
      echo 'bucket neyu-files ready'
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
